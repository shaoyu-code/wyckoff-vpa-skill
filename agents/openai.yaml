interface:
  display_name: "Wyckoff VPA"
  short_description: "Validated Wyckoff/VPA plans with risk and probability bands."
  default_prompt: "Run wyckoff-vpa for the symbol I name. Fetch and validate daily and weekly data, confirm post-event retests, then return a main plan, independent reverse plan, invalidation, position risk and P(T1 before stop)."

