name: apply-wyckoff-vpa-v2-repair

on:
  push:
    branches: ["repair/wyckoff-vpa-v2-hardening-20260904"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Bootstrap repair applicator'
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/wyckoff-vpa-v2-hardening-20260904
          fetch-depth: 0

      - name: Verify and unpack validated source tree
        shell: bash
        run: |
          set -euo pipefail
          cat _repair_payload.part* > /tmp/wyckoff-vpa-repair.tar.gz.b64
          echo "0251bfbd63cab09de38ba2213883671733fb20ece948afdfe051df450ac7607a  /tmp/wyckoff-vpa-repair.tar.gz.b64" | sha256sum -c -
          base64 --decode /tmp/wyckoff-vpa-repair.tar.gz.b64 > /tmp/wyckoff-vpa-repair.tar.gz
          echo "7a2288aeef5c72e86d1127e240089e18c09198779f1c5c3ec6a6805b09589da9  /tmp/wyckoff-vpa-repair.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/wyckoff-vpa-repair.tar.gz -C .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate repair before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m compileall -q scripts tests
          python scripts/test_compute_vpa.py
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden wyckoff-vpa contracts, validation, and risk controls"
          git push origin HEAD:repair/wyckoff-vpa-v2-hardening-20260904
