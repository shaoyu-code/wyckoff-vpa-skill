name: apply-wyckoff-vpa-v2-repair

on:
  push:
    branches: ["repair/wyckoff-vpa-v2-hardening-20260904"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Bootstrap repair applicator'
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/wyckoff-vpa-v2-hardening-20260904
          fetch-depth: 0

      - name: Verify and unpack validated source tree
        shell: bash
        run: |
          set -euo pipefail
          echo "21196057f079108fa83cc139bbb8955616e24a516d6590461ebfee4ef224189e  _repair_payload.part00" | sha256sum -c -
          echo "610209c20b15e0c09c694007ca92ca4931158667d73d381d50b082e992d4f4c7  _repair_payload.part01" | sha256sum -c -
          echo "edc4ccc9f0522f52f314dc8d75175790e51966bf8122c9ea9be0d49aebb4c47c  _repair_payload.part02" | sha256sum -c -
          echo "b00593dfac296e97e52ce2030950cf1f244d182be75ef50a70debe8ab3e1c889  _repair_payload.part03" | sha256sum -c -
          echo "f6c5f9cb6e571a032f17a8118aed5cbcdd1c5d1ed24eb0cb0810654ed45b01ea  _repair_payload.part04" | sha256sum -c -
          echo "92d665aac0f991dc8bdc4cc9e1b3710524b54e4f62e924560ec5b2c2293de3f3  _repair_payload.part05" | sha256sum -c -
          cat _repair_payload.part* > /tmp/wyckoff-vpa-repair.tar.gz.b64
          echo "0251bfbd63cab09de38ba2213883671733fb20ece948afdfe051df450ac7607a  /tmp/wyckoff-vpa-repair.tar.gz.b64" | sha256sum -c -
          base64 --decode /tmp/wyckoff-vpa-repair.tar.gz.b64 > /tmp/wyckoff-vpa-repair.tar.gz
          echo "7a2288aeef5c72e86d1127e240089e18c09198779f1c5c3ec6a6805b09589da9  /tmp/wyckoff-vpa-repair.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/wyckoff-vpa-repair.tar.gz -C .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate repair before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m compileall -q scripts tests
          python scripts/test_compute_vpa.py
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden wyckoff-vpa contracts, validation, and risk controls"
          git push origin HEAD:repair/wyckoff-vpa-v2-hardening-20260904
