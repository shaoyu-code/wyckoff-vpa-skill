name: validate

on:
  push:
    branches:
      - main
      - "deploy/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wyckoff-vpa-validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q scripts
      - name: Run offline regression suite
        run: python scripts/test_compute_vpa.py
      - name: Run adversarial gate suite
        run: python scripts/test_adversarial.py
      - name: Validate JSON fixtures
        run: python scripts/validate_examples.py
      - name: Validate Skill package contract
        run: python scripts/validate_skill.py
